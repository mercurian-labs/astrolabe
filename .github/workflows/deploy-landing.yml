name: Deploy landing site

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: landing-production
  cancel-in-progress: false

jobs:
  deploy_landing:
    name: Deploy production landing site
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    environment:
      name: production
    steps:
      - name: Check Cloudflare credentials
        shell: bash
        run: |
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            echo "CLOUDFLARE_API_TOKEN is not configured. See docs/operations/landing-deploy.md." >&2
            exit 1
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/landing...
              - --filter=@t3tools/web...

      - name: Build landing site
        run: vp run build:landing

      - name: Deploy landing site
        run: vp dlx wrangler@4.104.0 deploy
        working-directory: apps/landing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
