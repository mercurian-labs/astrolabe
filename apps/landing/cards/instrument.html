<!doctype html>
<!-- Astrolabe · share cards · the instrument
     [02]'s figure as a card: the site's own working astrolabe (src/scripts/instrument.js) set to a
     fixed moment, standing on its relit ground (relight.js), with the page's stylesheet, rulers,
     crosses and figure tags. The line is split either side of it, so the centre square (every square
     crop) is the instrument alone. Query: `line` (split at its first full stop), `t` and `tz` (the
     moment, as on the page), `ground=hemisphere` for Mercury's limb. -->
<html lang="en" class="js">
  <head>
    <meta charset="utf-8" />
    <title>Astrolabe · instrument</title>
    <link rel="stylesheet" href="/src/styles/drafting.css" />
    <style>
      html,
      body {
        margin: 0;
        overflow: hidden;
      }
      .value {
        display: block;
        border: 0;
      }
      .value > .sky {
        position: fixed;
        inset: 0;
        min-height: 0;
        border: 0;
        --ground-top: 61%;
      }
      .sky__art {
        top: 30px;
        height: 586px;
      }
      /* What the page shows only for the hand: the readouts, the sighting, the callouts, and the hard
         shadow the rete and rule cast (a card prints nothing lit). */
      .sky__time,
      .sky__wind,
      .sight,
      .star-tip,
      .callouts,
      .callout,
      .m-shadow {
        display: none !important;
      }
      .sky__tag {
        font-size: 15px;
      }
      .sky > .cross {
        transform: scale(1.4);
      }
      .wing {
        position: absolute;
        top: 154px;
        margin: 0;
        font-family: var(--serif);
        font-weight: 380;
        font-size: 64px;
        line-height: 1;
        letter-spacing: -0.03em;
        font-variation-settings:
          "opsz" 96,
          "SOFT" 30,
          "WONK" 0;
        color: var(--ink);
      }
      .wing--left {
        left: 56px;
      }
      .wing--right {
        right: 56px;
        text-align: right;
      }
      .mark {
        position: absolute;
        right: 56px;
        bottom: 46px;
        width: 172px;
      }
    </style>
  </head>
  <body>
    <section class="value" data-relight>
      <div class="sky" data-sight>
        <canvas class="relight__ground" data-relight-canvas aria-hidden="true"></canvas>
        <div class="relight__static" aria-hidden="true">
          <i class="relight__olive"></i><i class="relight__dark"></i><i class="relight__light"></i>
        </div>
        <i class="ruler ruler--x" aria-hidden="true"></i>
        <i class="ruler ruler--y" aria-hidden="true"></i>
        <div class="sky__art">
          <i class="sky__plate" aria-hidden="true"></i>
          <div class="sky__instrument" data-model></div>
        </div>
        <span class="cross cross--tl" aria-hidden="true"></span>
        <span class="cross cross--tr" aria-hidden="true"></span>
        <span class="cross cross--bl" aria-hidden="true"></span>
        <span class="cross cross--br" aria-hidden="true"></span>
        <p class="tag sky__tag sky__tag--tl">Fig. 1 · Planispheric astrolabe</p>
        <p class="tag sky__tag sky__tag--tr" data-plate>Plate for 40° N</p>
        <div class="sky__time" data-time hidden>
          <p class="tag"><span data-clock></span> <span data-date></span></p>
          <p class="tag" data-sky></p>
        </div>
        <div class="sky__wind" data-time hidden><button type="button" data-now>Now</button></div>
        <span class="tag star-tip" data-star-tip hidden></span>
        <p class="wing wing--left"></p>
        <p class="wing wing--right"></p>
        <img class="mark" src="/assets/brand/wordmark-small.svg" alt="" />
      </div>
    </section>
    <script type="module" src="./figure.js"></script>
  </body>
</html>
